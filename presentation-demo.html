function renderDashboard(){

 const gradeCounts=['A+','A','B+','B','C'].map(g=>[g, d.reduce((set,r)=>set.add(r.operator.employee_id),new Set()).size?0:0]);
 const opMetrics=cache.operators.map(o=>metricsFor(d.filter(r=>r.operator.employee_id===o.employee_id),f.filter(x=>x.operator===o.employee_id)));
 const gc=['A+','A','B+','B','C'].map(g=>[g,opMetrics.filter(x=>x.grade===g).length]);
 qs('#dashboard').innerHTML=hero('Management Overview','Presentation view of the same dashboard structure, KPI logic and controls used by the main STL FU application.')+
 `<div class="metrics">
  <div class="metric"><span class="label">Operators</span><strong>${cache.counts.operators}</strong><small>${cache.counts.operators} active in demo</small></div>
  <div class="metric"><span class="label">Active looms</span><strong>${cache.counts.looms}</strong><small>${cache.counts.looms} in master</small></div>
  <div class="metric"><span class="label">Production</span><strong>${fmt(sum(d,'actual'))}</strong><small>Target ${fmt(sum(d,'target'))} yd</small></div>
  <div class="metric"><span class="label">Production achievement</span><strong>${pct(m.production)}</strong><small>Excel formula</small></div>
  <div class="metric"><span class="label">Avg efficiency</span><strong>${pct(m.efficiency)}</strong><small>Technical loom efficiency</small></div>
  <div class="metric"><span class="label">Availability</span><strong>${pct(m.running)}</strong><small>Running / loom-hour</small></div>
 </div>
 <div class="split">
  <div class="card"><h3>Current KPI Snapshot</h3><div class="mini-bars">
   ${[['Production',m.production],['Efficiency',m.efficiency],['Availability',m.running],['Quality',m.rejection==null?null:Math.max(0,100-m.rejection)],['Housekeeping',m.housekeeping],['Attendance',m.attendance],['Skill / Process',m.skill]].map(([k,v])=>`<div class="bar-row"><span>${k}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,v??0))}%"></i></div><b>${v==null?'—':pct(v)}</b></div>`).join('')}
  </div></div>
  <div class="card"><h3>Grade distribution</h3><div class="mini-bars">
   ${gc.map(([g,c])=>`<div class="bar-row"><span><span class="badge grade-${g.replace('+','plus')}">${g}</span></span><div class="bar"><i style="width:${opMetrics.length?c/opMetrics.length*100:0}%"></i></div><b>${c}</b></div>`).join('')}
  </div><p class="small">A score appears only when all 9 KPI components are available.</p></div>
 </div>
 <div class="card"><div class="section-head"><div><h3>Recent Daily KPI Records</h3><p>Presentation records following the same table structure as the main application.</p></div><span class="badge">${d.length} rows</span></div>
 <div class="table-wrap"><table><thead><tr><th>Date</th><th>Shift</th><th>Operator</th><th>Loom assignment</th><th>Target yd</th><th>Actual yd</th><th>Prod Ach.</th><th>Efficiency</th><th>Running</th><th>Source</th></tr></thead><tbody>
 ${d.slice(0,56).map(r=>`<tr><td>${r.date}</td><td>${r.shift}</td><td>${r.operator.operator_name}</td><td>${r.looms}</td><td>${fmt(r.target)}</td><td>${fmt(r.actual)}</td><td>${pct(r.actual/r.target*100)}</td><td>${pct(r.efficiency)}</td><td>${pct(r.running/r.runningTarget*100)}</td><td>Demo</td></tr>`).join('')}
 </tbody></table></div></div>`;
}
function renderOperator(){
 const ids=cache.operators;
 qs('#operator').innerHTML=hero('Individual Operator View','Excel-aligned evaluation: 9 KPI components, weighted score, grade and incentive.')+
 `<div class="card"><div class="filters"><div class="field"><label>Operator</label><select id="opSel">${ids.map(o=>`<option value="${o.employee_id}">${o.employee_id} — ${o.operator_name}</option>`).join('')}</select></div><div class="field"><label>Evaluation From</label><input id="opFrom" type="date" value="2026-09-23"></div><div class="field"><label>Evaluation To</label><input id="opTo" type="date" value="2026-09-23"></div><div class="field"><label>Shift</label><select id="opShift"><option>All</option><option>A</option><option>B</option><option>C</option></select></div></div></div><div id="opContent"></div>`;
 ['opSel','opFrom','opTo','opShift'].forEach(id=>qs('#'+id).onchange=updateOperator); updateOperator();
}
function updateOperator(){
 const id=qs('#opSel').value;
 const rows=cache.daily.filter(r=>r.operator.employee_id===id);
 const faults=cache.faults.filter(f=>f.operator===id);
 const m=metricsFor(rows,faults),s=standard(),op=cache.operators.find(o=>o.employee_id===id);
 const labels=[['production','Loom-wise Production','Production Achievement %',s.production_target,s.production_weight],['efficiency','Loom Efficiency','Technical Efficiency %',s.efficiency_target,s.efficiency_weight],['running','Running / Availability','Running Achievement %',s.running_target,s.running_weight],['quality','Quality / Rejection','Rejection %',s.rejection_target,s.quality_weight],['fault','Fault Control','Faults / 1000 yd',s.faults_per_1000_target,s.fault_weight],['downtime','Downtime Control','Downtime Min / 1000 yd',s.downtime_per_1000_target,s.downtime_weight],['housekeeping','Housekeeping / SOP','Housekeeping %',s.housekeeping_target,s.housekeeping_weight],['attendance','Attendance / Discipline','Attendance %',s.attendance_target,s.attendance_weight],['skill','Skill / Process Compliance','Skill / Process %',s.skill_process_target,s.skill_process_weight]];
 qs('#opContent').innerHTML=`<div class="card"><div class="split"><div><div class="section-head"><div><h3>${op.operator_name}</h3><p>${id} · ${rows.length} KPI row(s) · ${faults.length} fault event(s)</p></div><span class="badge grade-${m.grade.replace('+','plus')}">${m.grade}</span></div><div class="metrics" style="grid-template-columns:repeat(3,1fr)"><div class="metric"><span class="label">Production</span><strong>${fmt(m.production)}%</strong></div><div class="metric"><span class="label">Efficiency</span><strong>${pct(m.efficiency)}</strong></div><div class="metric"><span class="label">Faults / 1000 yd</span><strong>${fmt(m.faults1000)}</strong></div></div></div><div style="display:grid;place-items:center"><div class="score-ring" style="--score:${m.score==null?0:Math.min(100,m.score*100)}"><b>${m.score==null?'—':(m.score*100).toFixed(2)}</b></div><div class="small" style="margin-top:7px">Overall KPI Score</div><div class="badge" style="margin-top:6px">Incentive: ${fmt(m.incentive)}</div></div></div></div>
 <div class="card"><h3>KPI Matrix</h3><div class="table-wrap"><table class="kpi-matrix"><thead><tr><th>Component</th><th>Target</th><th>Actual</th><th>Achievement</th><th>Weight</th><th>Weighted</th><th>Evaluation</th></tr></thead><tbody>
 ${labels.map(([key,name,metric,target,weight])=>{const actual=m[key],sc=m.scores[key];const ev=sc==null?'':sc>=100?'Meets / Exceeds':sc>=95?'Near Target':'Needs Attention';return `<tr><td>${name}</td><td>${fmt(target)}${key==='fault'||key==='downtime'?'':'%'}</td><td>${actual==null?'—':key==='fault'||key==='downtime'?fmt(actual):pct(actual)}</td><td>${sc==null?'—':pct(sc)}</td><td>${weight}%</td><td>${sc==null?'—':(Math.min(sc,120)*weight/100).toFixed(3)}</td><td>${ev}</td></tr>`}).join('')}
 <tr><th>OVERALL KPI SCORE</th><th colspan="4"></th><th>${m.score==null?'INCOMPLETE DATA':(m.score*100).toFixed(2)}</th><th>${m.grade}</th></tr></tbody></table></div></div>
 <div class="card"><h3>Loom-wise Production & Efficiency</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Shift</th><th>Loom No(s)</th><th>RPM</th><th>Avg PPI</th><th>Target yd</th><th>Actual yd</th><th>Efficiency</th><th>Running</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td>${r.date}</td><td>${r.shift}</td><td>${r.looms}</td><td>${fmt(r.rpm)}</td><td>${fmt(r.ppi)}</td><td>${fmt(r.target)}</td><td>${fmt(r.actual)}</td><td>${pct(r.efficiency)}</td><td>${pct(r.running/r.runningTarget*100)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function renderDaily(){
 qs('#daily').innerHTML=hero('Daily KPI Entry','New web records follow the same rule: one operator + date + actual shift + loom.')+
 `<div class="card"><div class="notice-line">PRESENTATION MODE — this screen demonstrates the same entry workflow. Save actions are disabled so the demo cannot alter live data.</div>
 <form class="form-grid" style="margin-top:13px" onsubmit="event.preventDefault();alert('Presentation mode: save is disabled.');">
 <div class="field"><label>Date *</label><input type="date" value="2026-09-23"></div><div class="field"><label>Planned Shift</label><select><option>A</option><option>B</option><option>C</option></select></div><div class="field"><label>Actual Shift</label><select><option>A</option><option>B</option><option>C</option></select></div><div class="field"><label>Shift Status</label><select><option>Normal</option><option>Changed</option><option>Temporary</option><option>Replacement</option></select></div>
 <div class="field"><label>Change Reason</label><select><option>Normal Rotation</option><option>Shift Swap</option><option>Leave Replacement</option><option>Production Requirement</option></select></div>
 <div class="field"><label>Operator *</label><select>${cache.operators.slice(0,20).map(o=>`<option>${o.employee_id} — ${o.operator_name}</option>`).join('')}</select></div>
 <div class="field"><label>Loom *</label><select>${cache.looms.slice(0,30).map(l=>`<option>${l.loom_code}</option>`).join('')}</select></div>
 ${[['Avg RPM','532'],['Avg PPI','42.00'],['Production Target (yd)','1600'],['Production Actual (yd)','1450'],['Running Hours','7.6'],['Rejection Yards','8'],['Housekeeping %','95'],['Attendance / Discipline %','100'],['Skill / Process %','95'],['SOP / Safety %','95']].map(([l,v])=>`<div class="field"><label>${l}</label><input value="${v}"></div>`).join('')}
 <div class="field full"><label>Remarks</label><textarea placeholder="Optional"></textarea></div><div class="actions full"><button class="btn" type="submit">Save KPI record</button><span class="small">Disabled in presentation mode</span></div></form></div>
 ${dailyTable()}`;
}
function dailyTable(){return `<div class="card"><div class="section-head"><div><h3>Enlisted Daily KPI Data</h3><p>Sample records visible in presentation mode.</p></div><span class="badge">${cache.daily.length} rows</span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Planned</th><th>Actual</th><th>Status</th><th>Operator</th><th>Loom</th><th>Target</th><th>Actual</th><th>Prod Ach.</th><th>Eff.</th><th>Source</th></tr></thead><tbody>${cache.daily.map(r=>`<tr><td>${r.date}</td><td>${r.planned}</td><td>${r.shift}</td><td>${r.status}</td><td>${r.operator.operator_name}</td><td>${r.looms}</td><td>${fmt(r.target)}</td><td>${fmt(r.actual)}</td><td>${pct(r.actual/r.target*100)}</td><td>${pct(r.efficiency)}</td><td>Demo</td></tr>`).join('')}</tbody></table></div></div>`}
function renderFaults(){
 qs('#faults').innerHTML=hero('Fault & Downtime','Event-level control: frequency, affected fabric and downtime are kept as separate measures.')+
 `<div class="card"><div class="notice-line">PRESENTATION MODE — sample fault events are displayed. Save actions are disabled.</div></div>
 <div class="card"><div class="section-head"><div><h3>Fault Event Register</h3><p>Same event-level structure as the main application.</p></div><span class="badge">${cache.faults.length} rows</span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Shift</th><th>Operator</th><th>Loom</th><th>Category</th><th>Fault</th><th>Freq.</th><th>Affected yd</th><th>Down min</th><th>Severity</th><th>Responsibility</th></tr></thead><tbody>${cache.faults.map(r=>`<tr><td>${r.date}</td><td>${r.shift}</td><td>${r.operator}</td><td>${r.loom}</td><td>${r.category}</td><td>${r.fault}</td><td>${fmt(r.freq)}</td><td>${fmt(r.affected)}</td><td>${fmt(r.down)}</td><td>${r.severity}</td><td>${r.responsibility}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function renderMasters(){
 const s=standard();
 qs('#masters').innerHTML=hero('Masters & Standards','Admin reference area. Standards remain controlled by the approved Excel scoring model.')+
 `<div class="card"><h3>Active KPI Standards</h3><div class="table-wrap"><table><thead><tr><th>Component</th><th>Weight</th><th>Target</th><th>Direction</th></tr></thead><tbody>
 ${[['Production',s.production_weight,s.production_target,'Higher'],['Loom Efficiency',s.efficiency_weight,s.efficiency_target,'Higher'],['Running / Availability',s.running_weight,s.running_target,'Higher'],['Quality / Rejection',s.quality_weight,s.rejection_target,'Lower'],['Fault Control',s.fault_weight,s.faults_per_1000_target,'Lower'],['Downtime Control',s.downtime_weight,s.downtime_per_1000_target,'Lower'],['Housekeeping / SOP',s.housekeeping_weight,s.housekeeping_target,'Higher'],['Attendance / Discipline',s.attendance_weight,s.attendance_target,'Higher'],['Skill / Process Compliance',s.skill_process_weight,s.skill_process_target,'Higher']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}%</td><td>${r[2]}${r[0].includes('Control')?'':'%'}</td><td>${r[3]}</td></tr>`).join('')}
 </tbody></table></div></div>
 <div class="split"><div class="card"><h3>Operator Master · ${cache.counts.operators}</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Active</th><th>Designation</th></tr></thead><tbody>${cache.operators.map(o=>`<tr><td>${o.employee_id}</td><td>${o.operator_name}</td><td>Yes</td><td>${o.designation}</td></tr>`).join('')}</tbody></table></div></div>

 <div class="card"><h3>Fault Master · ${cache.counts.faultMaster}</h3><div class="table-wrap"><table><thead><tr><th>Code</th><th>Category</th><th>Fault</th><th>Severity</th><th>Responsibility</th></tr></thead><tbody>${cache.faultMaster.map(f=>`<tr><td>${f.code}</td><td>${f.category}</td><td>${f.name}</td><td>${f.severity}</td><td>${f.responsibility}</td></tr>`).join('')}</tbody></table></div></div>`;

 m.onclick=()=>{const n=qs('#mainNav'),open=n.classList.toggle('open');m.setAttribute('aria-expanded',String(open));m.textContent=open?'×':'☰'};
}
nav();initMenu();navTab('dashboard');
