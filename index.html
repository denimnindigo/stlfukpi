<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102d46"><meta name="description" content="STL FU Weaving KPI Management System">
<title>STL FU · Weaving KPI</title><link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<div class="auth-shell"><div class="auth-texture"></div><div class="auth-card">
  <div class="brand-lockup"><div class="brand-mark">WK</div><div><div class="eyebrow">STL FU · WEAVING</div><h1>Performance Management</h1><p>Denim mill KPI control room</p></div></div>
  <div class="auth-tabs"><button class="auth-tab active" type="button">Temporary access</button></div>
  <div class="notice" style="display:block;margin-bottom:14px">Temporary offline mode — Supabase authentication is bypassed while the API hostname issue is being resolved.</div>
  <form id="loginForm" class="auth-form">
    <label>User ID<input id="loginId" type="text" autocomplete="username" required value="admin"></label>
    <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Password"></label>
    <button class="primary-btn" type="submit">Sign in <span>→</span></button>
    <div id="loginError" class="form-error"></div>
  </form>
  <div class="auth-foot"><span>Indigo / Woven / Controlled</span><span>Temporary v2.0</span></div>
</div></div>
<script>
const FIXED_ID='admin';
const FIXED_PASSWORD='STL2026';
if(localStorage.getItem('stlfu_offline_session')==='1') location.href='app.html';
document.getElementById('loginForm').addEventListener('submit',function(e){
 e.preventDefault();
 const id=document.getElementById('loginId').value.trim();
 const pw=document.getElementById('loginPassword').value;
 const err=document.getElementById('loginError');
 if(id===FIXED_ID && pw===FIXED_PASSWORD){localStorage.setItem('stlfu_offline_session','1');location.href='app.html';}
 else err.textContent='Invalid User ID or Password.';
});
</script>
</body></html>
