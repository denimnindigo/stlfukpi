<header class="top"><div class="brand">WEAVING KPI</div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="data-entry.html">Daily KPI</a><a href="fault-entry.html">Fault Entry</a><button data-logout>Logout</button></nav></header>
<main class="wrap"><div class="hero"><h1>Fault & Downtime Entry</h1><p class="muted">Detailed fault capture. This prototype stores the form locally; the production version will save to Supabase.</p></div>
<div class="card"><div class="formgrid">
<div class="field"><label>Date</label><input type="date"></div><div class="field"><label>Shift</label><select><option>A</option><option>B</option><option>C</option></select></div><div class="field"><label>Loom</label><input placeholder="L-025"></div>
<div class="field"><label>Operator ID</label><input placeholder="STL005494"></div><div class="field"><label>Fault Type</label><select><option>Warp Break</option><option>Weft Break</option><option>Missing Pick</option><option>Stop Mark</option><option>Start Mark</option><option>L. End</option><option>Y. Mix</option><option>Other</option></select></div>
<div class="field"><label>Frequency</label><input type="number" min="0"></div><div class="field"><label>Affected Yards</label><input type="number" min="0"></div><div class="field"><label>Downtime (min)</label><input type="number" min="0"></div>
<div class="field"><label>Responsibility</label><select><option>Operator</option><option>Supervisor</option><option>Machine</option><option>Material</option><option>Process</option><option>Other</option></select></div>
<div class="full"><button class="btn" onclick="alert('Prototype form. Production version will save this to the shared database.')">SAVE FAULT</button></div>
</div></div></main>
